[package]
name = "lsmtop"
version = "0.4.1"
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
authors = ["Chris Marentette <chris.marentette@gmail.com>"]
repository = "https://github.com/chrismarentette/lsmtop"
homepage = "https://github.com/chrismarentette/lsmtop"
description = "top-style TUI monitor for llama-server / llama-swap"

[features]
default = ["nvml"]
nvml = ["dep:nvml-wrapper"]

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
anyhow = "1"
thiserror = "1"
nvml-wrapper = { version = "0.10", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
insta = { version = "1", features = ["ron"] }
tempfile = "3"
serial_test = "3"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = true
strip = true

# perf work (docs/perf-gate.md): release-speed binary WITH symbols so
# perf/flamegraph can attribute samples honestly. Frame pointers come via
# `RUSTFLAGS="-C force-frame-pointers"` at build time — the manifest key is
# unstable and its warning alone fails the clippy -D warnings gate.
[profile.profiling]
inherits = "release"
debug = 2
lto = "thin"
codegen-units = 1

[[bench]]
name = "render_bench"
harness = false

[[bench]]
name = "diff_bench"
harness = false

[[bench]]
name = "ingest_bench"
harness = false

